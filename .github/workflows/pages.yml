name: サイトマップの同期と公開

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 0 * * *'

permissions:
  contents: read

concurrency:
  group: sitemap-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: サイトマップ検証のテスト
        run: python3 -m unittest test_build.py
      - name: 本サイトのXMLを検証してコピー
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
